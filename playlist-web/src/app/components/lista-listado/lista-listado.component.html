<h2 class="titulo">Descripción Listas de Reproducción</h2>

<mat-list>
  <mat-list-item *ngFor="let lista of listas" class="item-lista">
    <div class="lista-info">
      <h4 class="nombre-lista">{{ lista.nombre }}</h4>
      <p class="descripcion-lista">{{ lista.descripcion }}</p>
    </div>
    <button mat-icon-button color="warn" (click)="eliminar(lista.nombre)" aria-label="Eliminar lista">
      <mat-icon>delete</mat-icon>
    </button>
  </mat-list-item>
</mat-list>
